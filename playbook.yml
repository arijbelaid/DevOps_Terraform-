---
- name: Installer Docker
  hosts: all
  become: true
  tasks:
    - name: Installer Docker
      apt:
        name: docker.io
        state: present
        update_cache: true
    - name: Démarrer Docker
      service:
        name: docker
        state: started
        enabled: true
    - name: Ajouter l'utilisateur vagrant au groupe docker
      user:
        name: vagrant
        groups: docker
        append: true
